plugins {
    id 'maven-publish'
    id 'com.enonic.xp.app'
    id 'com.enonic.defaults' version '2.1.7'
}

app {
    systemVersion = "[8.1,9)"
    scriptEngine = "GraalJS"
}

dependencies {
    include libs.lib.mustache
    include libs.lib.http.client
    include libs.lib.static
    include libs.lib.router
}

repositories {
    mavenCentral()
    xp.enonicRepo('dev')
}

tasks.register('testMcp', Exec) {
    group = 'verification'
    description = 'Tests the MCP fact contribution with Node.js 24 or newer.'
    commandLine 'node', '--test', 'src/test/js/chucknorris.test.cjs'
}

tasks.named('check') {
    dependsOn tasks.named('testMcp')
}
